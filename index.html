<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>童林幼兒園 出缺勤系統</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f5f6f8; margin: 0; padding: 16px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
    .card { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 420px; padding: 20px; text-align: center; }
    .profile-img { width: 70px; height: 70px; border-radius: 50%; margin-bottom: 10px; object-fit: cover; border: 2px solid #06C755; }
    .user-name { font-size: 1.1rem; font-weight: bold; color: #333; margin-bottom: 4px; }
    .status-text { font-size: 0.82rem; color: #666; margin-bottom: 16px; }
    
    .nav-tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 16px; }
    .nav-tab { flex: 1; padding: 10px 0; font-weight: bold; color: #777; cursor: pointer; text-align: center; font-size: 0.95rem; }
    .nav-tab.active { color: #06C755; border-bottom: 3px solid #06C755; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .btn-group { display: flex; gap: 12px; margin-bottom: 16px; }
    .btn { flex: 1; padding: 14px 0; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .btn-clock-in { background-color: #06C755; color: white; }
    .btn-clock-out { background-color: #35495e; color: white; }
    .btn-submit { background-color: #0d6efd; color: white; width: 100%; padding: 12px; margin-top: 10px; }
    .btn:disabled { background-color: #ccc; cursor: not-allowed; }
    
    .form-group { text-align: left; margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 4px; color: #555; }
    .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; }
    .form-control[readonly] { background-color: #e9ecef; color: #495057; font-weight: bold; }
    .row-group { display: flex; gap: 8px; }

    .info-box { background: #f0f4f8; border-radius: 8px; padding: 12px; font-size: 0.88rem; color: #444; text-align: left; word-break: break-all; line-height: 1.6; }
    .loading { display: none; color: #06C755; font-weight: bold; margin-bottom: 12px; font-size: 0.95rem; }
    
    .status-success { color: #0d6efd; font-weight: bold; background-color: #e7f1ff; padding: 8px 10px; border-radius: 6px; display: block; margin-top: 4px; }
    .status-error { color: #d90429; font-weight: bold; background-color: #ffe5e5; padding: 8px 10px; border-radius: 6px; display: block; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="card">
    <img id="userImg" class="profile-img" src="https://via.placeholder.com/70" alt="Avatar">
    <div id="userName" class="user-name">載入使用者資訊中...</div>
    <div id="userId" class="status-text">LINE ID: --</div>

    <div class="nav-tabs">
      <div id="tab1" class="nav-tab active" onclick="switchTab('clock')">打卡報到</div>
      <div id="tab2" class="nav-tab" onclick="switchTab('leave')">線上請假</div>
    </div>

    <div id="loadingText" class="loading">⏳ 資料處理中，請稍後...</div>

    <!-- 1. 打卡頁面 -->
    <div id="clockContent" class="tab-content active">
      <div class="btn-group">
        <button id="btnClockIn" class="btn btn-clock-in" onclick="handleClock('CLOCK_IN')" disabled>上班打卡</button>
        <button id="btnClockOut" class="btn btn-clock-out" onclick="handleClock('CLOCK_OUT')" disabled>下班打卡</button>
      </div>

      <div class="info-box">
        <strong>當前打卡狀態：</strong><br>
        <span id="logMsg">等待初始化...</span><br><br>
        <strong>GPS 座標：</strong><span id="geoCoords">未取得</span>
      </div>
    </div>

    <!-- 2. 請假頁面 -->
    <div id="leaveContent" class="tab-content">
      <form id="leaveForm" onsubmit="handleLeaveSubmit(event)">
        <div class="form-group">
          <label>請假類別</label>
          <select id="leaveType" class="form-control" required>
            <option value="事假">事假</option>
            <option value="病假">病假</option>
            <option value="特休">特休</option>
            <option value="公假">公假</option>
            <option value="喪假">喪假</option>
          </select>
        </div>

        <div class="form-group">
          <label>開始時間</label>
          <div class="row-group">
            <input type="date" id="startDate" class="form-control" onchange="calculateLeaveDays()" required>
            <input type="time" id="startTime" class="form-control" value="08:00" onchange="calculateLeaveDays()" required>
          </div>
        </div>

        <div class="form-group">
          <label>結束時間</label>
          <div class="row-group">
            <input type="date" id="endDate" class="form-control" onchange="calculateLeaveDays()" required>
            <input type="time" id="endTime" class="form-control" value="17:00" onchange="calculateLeaveDays()" required>
          </div>
        </div>

        <div class="form-group">
          <label>系統自動計算請假天數 (每天以 8 小時折算)</label>
          <input type="number" id="leaveDays" class="form-control" value="1" readonly>
        </div>

        <div class="form-group">
          <label>事由說明</label>
          <textarea id="leaveReason" class="form-control" rows="2" placeholder="請填寫簡短事由..." required></textarea>
        </div>

        <button type="submit" id="btnLeaveSubmit" class="btn btn-submit" disabled>送出請假單</button>
      </form>
      <br>
      <div class="info-box">
        <span id="leaveMsg">請填寫請假單資料</span>
      </div>
    </div>

  </div>

  <script>
    const MY_LIFF_ID = "2011544779-xcU8XKhd";
    const BACKEND_API_URL = "https://script.google.com/macros/s/AKfycbz83EWMrOYOP5knxpwV-V_eCOwsSAScT1tGplu7aau6e7kovs6AYPe9E6RqD3WCV1UT/exec";
    const AUTO_CLOSE_DELAY = 4000;

    let currentUserProfile = null;

    document.addEventListener("DOMContentLoaded", function() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById("startDate").value = today;
      document.getElementById("endDate").value = today;
      calculateLeaveDays();

      liff.init({ liffId: MY_LIFF_ID })
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
          } else {
            getUserProfile();
          }
        })
        .catch((err) => {
          updateLog("LIFF 初始化失敗: " + (err.message || JSON.stringify(err)), false);
        });
    });

    // 前端自動計算請假天數邏輯
    function calculateLeaveDays() {
      const startDateVal = document.getElementById("startDate").value;
      const startTimeVal = document.getElementById("startTime").value || "08:00";
      const endDateVal = document.getElementById("endDate").value;
      const endTimeVal = document.getElementById("endTime").value || "17:00";

      if (!startDateVal || !endDateVal) return;

      const start = new Date(`${startDateVal}T${startTimeVal}`);
      const end = new Date(`${endDateVal}T${endTimeVal}`);

      if (end <= start) {
        document.getElementById("leaveDays").value = 0;
        return;
      }

      // 計算總小時數 (每日以 8 小時折算為 1 天)
      const diffMs = end - start;
      const diffHours = diffMs / (1000 * 60 * 60);
      let calculatedDays = Math.round((diffHours / 8) * 10) / 10;

      if (calculatedDays <= 0) calculatedDays = 0.5;
      document.getElementById("leaveDays").value = calculatedDays;
    }

    function getUserProfile() {
      liff.getProfile()
        .then((profile) => {
          currentUserProfile = profile;
          document.getElementById("userName").innerText = profile.displayName;
          document.getElementById("userId").innerText = "ID: " + profile.userId;
          if (profile.pictureUrl) {
            document.getElementById("userImg").src = profile.pictureUrl;
          }
          document.getElementById("btnClockIn").disabled = false;
          document.getElementById("btnClockOut").disabled = false;
          document.getElementById("btnLeaveSubmit").disabled = false;
          updateLog("初始化完成，請選擇打卡項目。");
        })
        .catch((err) => {
          updateLog("無法取得 User Profile: " + err.message, false);
        });
    }

    function switchTab(tabName) {
      document.getElementById("tab1").classList.toggle("active", tabName === 'clock');
      document.getElementById("tab2").classList.toggle("active", tabName === 'leave');
      document.getElementById("clockContent").classList.toggle("active", tabName === 'clock');
      document.getElementById("leaveContent").classList.toggle("active", tabName === 'leave');
    }

    function handleClock(type) {
      if (!currentUserProfile) return;
      setLoading(true);
      updateLog("正在取得 GPS 定位資訊...");

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            document.getElementById("geoCoords").innerText = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
            
            sendDataToBackend({
              action: 'CLOCK_IN_OUT',
              userId: currentUserProfile.userId,
              displayName: currentUserProfile.displayName,
              type: type,
              latitude: lat,
              longitude: lng
            }, 'clock');
          },
          (error) => {
            setLoading(false);
            updateLog("定位失敗，請確認已開啟手機 GPS 與權限。", false);
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      } else {
        setLoading(false);
        updateLog("裝置不支援定位功能。", false);
      }
    }

    function handleLeaveSubmit(e) {
      e.preventDefault();
      if (!currentUserProfile) return;

      const daysVal = parseFloat(document.getElementById("leaveDays").value);
      if (daysVal <= 0) {
        alert("結束時間必須晚於開始時間！");
        return;
      }

      setLoading(true);
      const leaveData = {
        action: 'APPLY_LEAVE',
        userId: currentUserProfile.userId,
        displayName: currentUserProfile.displayName,
        leaveType: document.getElementById("leaveType").value,
        startDate: document.getElementById("startDate").value,
        startTime: document.getElementById("startTime").value,
        endDate: document.getElementById("endDate").value,
        endTime: document.getElementById("endTime").value,
        days: daysVal,
        reason: document.getElementById("leaveReason").value
      };

      sendDataToBackend(leaveData, 'leave');
    }

    function sendDataToBackend(data, sourceTab) {
      fetch(BACKEND_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(data)
      })
      .then(response => response.text())
      .then(text => {
        const result = JSON.parse(text);
        setLoading(false);

        if (result.success) {
          if (sourceTab === 'clock') {
            updateLog(`✅ ${result.message}<br><small>（視窗將於 4 秒後自動關閉）</small>`, true);
          } else {
            document.getElementById("leaveMsg").innerHTML = `<span class="status-success">✅ ${result.message}</span>`;
          }

          if (liff.isInClient()) {
            setTimeout(() => { liff.closeWindow(); }, AUTO_CLOSE_DELAY);
          }
        } else {
          if (sourceTab === 'clock') {
            updateLog(`❌ ${result.message}`, false);
          } else {
            document.getElementById("leaveMsg").innerHTML = `<span class="status-error">❌ ${result.message}</span>`;
          }
        }
      })
      .catch(err => {
        setLoading(false);
        if (sourceTab === 'clock') {
          updateLog("連線失敗: " + err.message, false);
        } else {
          document.getElementById("leaveMsg").innerHTML = `<span class="status-error">連線失敗: ${err.message}</span>`;
        }
      });
    }

    function updateLog(msg, isSuccess = null) {
      const logElement = document.getElementById("logMsg");
      logElement.innerHTML = msg;
      logElement.className = "";
      if (isSuccess === true) logElement.classList.add("status-success");
      if (isSuccess === false) logElement.classList.add("status-error");
    }

    function setLoading(isLoading) {
      document.getElementById("loadingText").style.display = isLoading ? "block" : "none";
      document.getElementById("btnClockIn").disabled = isLoading;
      document.getElementById("btnClockOut").disabled = isLoading;
      document.getElementById("btnLeaveSubmit").disabled = isLoading;
    }
  </script>
</body>
</html>
